name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  tests:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.10" }
          - { os: ubuntu-latest, python: "3.12" }
          - { os: ubuntu-latest, python: "3.14" }
          - { os: macos-latest, python: "3.12" }
          - { os: windows-latest, python: "3.12" }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Qt WebEngine's shared libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libopengl0 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xfixes0 libxcb-xkb1 \
            libnss3 libnspr4 libasound2t64 libxcomposite1 libxdamage1 libxrandr2 libgbm1 \
            libxtst6 libxss1 libfontconfig1 libdbus-1-3 libxcursor1 libxi6 libsm6 libice6
      - name: install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: tests
        run: python -m pytest -q
      - name: the Flipper app's logic under node
        run: node flipper-app/test_logic.js
      - name: the command line, the way a user runs it
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          warmap --version
          warmap formats
          warmap stats warmap/sample
          warmap export warmap/sample -f gpx -o out.gpx
          warmap export warmap/sample -f geojson -o out.geojson
          warmap flock
          test -s out.gpx && test -s out.geojson
      - name: the wheel carries the data, the sample, the map and the phone app
        run: |
          python -m pip wheel . --no-deps -w dist
          python - <<'PY'
          import glob, zipfile
          wheel = glob.glob("dist/warmap-*.whl")[0]
          names = set(zipfile.ZipFile(wheel).namelist())
          need = [
              "warmap/data/flock_cameras.json", "warmap/data/oui.json",
              "warmap/data/bluetooth-companies.json", "warmap/data/bluetooth-uuids.json",
              "warmap/sample/sample_wardrive.csv", "warmap/sample/sample_track.gpx",
              "warmap/sample/flipper/subghz/GarageRemote_20260614-091530.sub",
              "warmap/sample/flipper/nfc/OfficeBadge_20260614-091850.nfc",
              "warmap/web/map.html", "warmap/web/map.js", "warmap/web/map.css",
              "warmap/web/vendor/leaflet/leaflet.js", "warmap/web/vendor/leaflet/leaflet.css",
              "warmap/web/vendor/leaflet/images/marker-icon.png",
              "warmap/web/vendor/leaflet.markercluster/leaflet.markercluster.js",
              "warmap/web/vendor/leaflet.heat/leaflet-heat.js",
              "warmap/webapp/index.html", "warmap/webapp/app.js", "warmap/webapp/sw.js",
              "warmap/webapp/manifest.webmanifest", "warmap/webapp/icon-512.png",
          ]
          missing = [n for n in need if n not in names]
          if missing:
              raise SystemExit(f"missing from the wheel: {missing}")
          print(f"{wheel}: {len(names)} files, all required data present")
          PY
