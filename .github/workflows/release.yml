name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  bundle:
    name: ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, label: linux-x86_64 }
          - { os: windows-latest, label: windows-x64 }
          - { os: macos-latest, label: macos-arm64 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Qt WebEngine's shared libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libopengl0 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 \
            libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xfixes0 libxcb-xkb1 \
            libnss3 libnspr4 libasound2 libxcomposite1 libxdamage1 libxrandr2 libgbm1 \
            libxtst6 libxss1 libfontconfig1 libdbus-1-3 libxcursor1 libxi6 libsm6 libice6
      - name: install
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pyinstaller pillow
      - name: version
        id: version
        run: echo "version=$(python -c 'import warmap; print(warmap.__version__)')" >> "$GITHUB_OUTPUT"
      - name: icons
        run: python packaging/make_icons.py
      - name: build
        run: pyinstaller --noconfirm --log-level WARN packaging/warmap.spec
      - name: the bundle runs, and its map engine starts
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then bin="dist/warmap.app/Contents/MacOS/warmap"
          elif [ "$RUNNER_OS" = "Windows" ]; then bin="dist/warmap/warmap-cli.exe"
          else bin="dist/warmap/warmap"; fi
          "$bin" --version
          "$bin" formats
          "$bin" stats warmap/sample
          "$bin" doctor --map
      - name: pack
        id: pack
        env:
          VERSION: ${{ steps.version.outputs.version }}
          LABEL: ${{ matrix.label }}
        run: |
          mkdir -p out
          if [ "$RUNNER_OS" = "macOS" ]; then
            name="warmap-$VERSION-$LABEL.zip"
            ditto -c -k --keepParent dist/warmap.app "out/$name"
          elif [ "$RUNNER_OS" = "Windows" ]; then
            name="warmap-$VERSION-$LABEL.zip"
            (cd dist && 7z a -tzip "../out/$name" warmap > /dev/null)
          else
            name="warmap-$VERSION-$LABEL.tar.gz"
            tar -C dist -czf "out/$name" warmap
          fi
          ls -la out
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.pack.outputs.name }}
          path: out/${{ steps.pack.outputs.name }}
          if-no-files-found: error

  draft:
    name: draft release
    needs: bundle
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: out
          merge-multiple: true
      - name: checksums and notes
        run: |
          (cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
          python - <<'PY'
          import re
          tag = "${{ github.ref_name }}"
          version = tag.lstrip("v")
          text = open("CHANGELOG.md", encoding="utf-8").read()
          match = re.search(rf"^## {re.escape(version)}\n(.*?)(?=^## |\Z)", text, re.S | re.M)
          body = match.group(1).strip() if match else f"warmap {version}."
          body += "\n\nDownloads: the Linux tarball, the Windows zip and the macOS app zip below need no Python. Unpack and run `warmap`. `pipx install git+https://github.com/munzzyy/warmap` installs from source."
          open("notes.md", "w", encoding="utf-8").write(body + "\n")
          PY
      - name: draft release with the bundles attached
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            gh release create "$TAG" --draft --verify-tag --title "warmap ${TAG#v}" --notes-file notes.md
          fi
          gh release upload "$TAG" out/* --clobber
